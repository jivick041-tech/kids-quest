<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竹林小隊練功坊｜三年級數學×英文</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#FFF6E5;--ink:#2B2A4C;--mut:#7B7893;--line:#EFE5CF;--or:#FF8A3D;--ord:#D9661A;--gr:#2FB36D;--grd:#1F8A50;--bl:#4C8DFF;--bld:#2F68D8;--pu:#8B5CF6;--pud:#6D3FD6;--rd:#F05252;--rdd:#C53030;--ye:#FFC93C}
html,body{margin:0;color:var(--ink);font-family:'Baloo 2','Noto Sans TC',system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 8% 0,#FFE3AE 0,transparent 38%),radial-gradient(circle at 100% 25%,#DDF1FF 0,transparent 40%),var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}
.muted{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:16px;padding:11px 20px;font-size:18px;font-weight:800;color:#fff;background:var(--bl);box-shadow:0 5px 0 var(--bld);transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bld)}
.btn.or{background:var(--or);box-shadow:0 5px 0 var(--ord)}
.btn.gr{background:var(--gr);box-shadow:0 5px 0 var(--grd)}
.btn.pu{background:var(--pu);box-shadow:0 5px 0 var(--pud)}
.btn.rd{background:var(--rd);box-shadow:0 5px 0 var(--rdd)}
.btn.gh{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:6px 14px;font-size:16px}
.btn:disabled{opacity:.45;pointer-events:none}
.card{background:#fff;border-radius:22px;border:2px solid var(--line);box-shadow:0 6px 0 var(--line);padding:16px}
.top{display:flex;align-items:center;gap:14px}
.pet{font-size:46px;width:72px;height:72px;flex:none;display:grid;place-items:center;background:#FFF0D1;border-radius:50%;border:3px solid #FFD98A}
.xpbar{height:14px;background:#F1E8D4;border-radius:10px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#FFC93C,#FF8A3D);border-radius:10px;transition:width .6s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{background:#fff;border:2px solid var(--line);border-radius:99px;padding:3px 12px;font-weight:700;font-size:15px}
button.chip{color:var(--ink)}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px 0 18px}
.world{border:0;border-radius:24px;padding:16px 14px;color:#fff;text-align:left;min-height:150px}
.world .ic{font-size:46px;line-height:1.1}
.world b{font-size:23px;display:block;margin-top:4px}
.world small{opacity:.95;font-size:14px;font-weight:600}
.world.m{background:linear-gradient(135deg,#FFB547,#FF7A3D);box-shadow:0 6px 0 #D35D1C}
.world.e{background:linear-gradient(135deg,#4ED68A,#1FA468);box-shadow:0 6px 0 #167F4D}
.world:active{transform:translateY(4px)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.tool{background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:10px 4px;font-weight:700;font-size:14px;color:var(--ink);position:relative}
.tool span{font-size:30px;display:block}
.badge{position:absolute;top:-6px;right:-4px;background:var(--rd);color:#fff;border-radius:99px;font-size:12px;padding:0 7px}
.mis{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.mis:last-child{border:0}
.mis .t{flex:1;font-weight:700}
.mbar{height:8px;background:#F1E8D4;border-radius:6px;overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;background:var(--gr)}
.zone h3{margin:22px 4px 10px;font-size:20px}
.zone p{margin:-6px 4px 10px;font-size:14px}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.node{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:12px 8px;text-align:center;color:var(--ink)}
.node:active{transform:translateY(3px)}
.node .ic{font-size:36px;line-height:1.2}
.node b{display:block;font-size:16px;line-height:1.25;margin-top:2px}
.node small{color:var(--mut);font-size:12px;display:block}
.lvrow{display:flex;justify-content:center;gap:4px;margin-top:8px;font-size:12px;flex-wrap:wrap}
.lvp{background:#F7F1E3;border-radius:8px;padding:0 6px;color:#B9A67A;white-space:nowrap}
.lvp.on{background:#FFF3C9;color:#C98A00}
.node.boss{background:linear-gradient(135deg,#3D2B6B,#6D3FD6);color:#fff;border-color:#3D2B6B;box-shadow:0 5px 0 #2A1C4F;grid-column:1/-1}
.node.boss small{color:#E5DBFF}
.node.lock{filter:grayscale(.8);opacity:.75}
.ov{position:fixed;inset:0;background:rgba(43,42,76,.5);display:grid;place-items:center;z-index:70;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:24px;max-width:430px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.lvl{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px;width:100%;background:#fff;text-align:left;color:var(--ink)}
.lvl .n{font-size:20px;font-weight:800;width:54px}
.lvl .d{flex:1;font-size:14px}
.lvl .s{font-size:20px;letter-spacing:1px}
.lvl:disabled{opacity:.5}
.phead{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:16px;background:#F1E8D4;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gr);border-radius:10px;transition:width .3s}
.combo{font-weight:800;color:var(--or);min-width:52px;text-align:right}
.qcard{margin:16px 0;text-align:center;padding:20px 14px;font-size:23px;font-weight:700;line-height:1.55}
.qcard .big{font-size:38px;letter-spacing:1px;font-family:'Baloo 2'}
.pic{font-size:88px;line-height:1.15}
.sw{display:inline-block;width:92px;height:92px;border-radius:24px;border:3px solid rgba(43,42,76,.15);vertical-align:middle}
.sw.s{width:64px;height:64px;border-radius:18px}
.numpic{font-size:76px;font-weight:800;color:var(--bl);font-family:'Baloo 2';line-height:1.1}
.numpic.s{font-size:48px}
.sent{font-size:27px;font-family:'Baloo 2';font-weight:700;line-height:1.4}
.blank{color:var(--or)}
.zh{color:var(--mut);font-size:17px;font-weight:600;margin-top:4px}
.say{border:0;background:#E9F1FF;color:var(--bld);border-radius:99px;padding:6px 18px;font-size:19px;font-weight:800;margin:6px 4px}
.say.big{font-size:24px;padding:10px 26px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.cmp{grid-template-columns:repeat(3,1fr)}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:12px 8px;font-size:22px;font-weight:700;color:var(--ink);min-height:68px;line-height:1.35}
.opt:active{transform:translateY(3px)}
.opts.cmp .opt{font-size:36px}
.opt.pico{font-size:58px;min-height:100px}
.opt.ok{border-color:var(--gr);background:#E6F8EE;box-shadow:0 5px 0 var(--gr)}
.opt.no{border-color:var(--rd);background:#FDECEC;opacity:.55;pointer-events:none}
.disp{min-height:66px;border:3px dashed #D9CDB0;border-radius:18px;background:#fff;font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:6px;margin:0 auto 12px;max-width:520px;font-family:'Baloo 2'}
.disp.bad{border-color:var(--rd);color:var(--rd);font-size:26px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
.key{background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);font-size:28px;font-weight:800;padding:9px 0;color:var(--ink)}
.key:active{transform:translateY(3px)}
.key.ok{background:var(--gr);color:#fff;border-color:var(--gr);box-shadow:0 4px 0 var(--grd)}
.tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.tile{background:#FFF3D6;border:2px solid #F4D48C;border-radius:12px;box-shadow:0 4px 0 #EFC566;font-size:24px;font-weight:800;padding:5px 14px;color:var(--ink);min-width:48px;font-family:'Baloo 2'}
.tile.used{visibility:hidden}
.tile.in{background:#E9F1FF;border-color:#B9D0FF;box-shadow:0 4px 0 #9DBBFA}
.fb{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:40;animation:up .2s}
.fb .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb.ok{background:#D9F7E6;border-top:3px solid var(--gr)}
.fb.retry{background:#FFF0D9;border-top:3px solid var(--or)}
.fb.bad{background:#FDE3E3;border-top:3px solid var(--rd)}
.fb h3{font-size:22px}
.fb h3 small{font-size:16px;color:var(--grd)}
.fb p{margin:4px 0 0;font-size:16px;font-weight:600}
.spacer{height:150px}
.shake{animation:shake .35s}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.bob{animation:bob 1.6s ease-in-out infinite;display:inline-block}
.starsbig{font-size:58px;letter-spacing:6px;margin:6px 0}
.starsbig span{display:inline-block;animation:pop .5s both}
.starsbig .off{filter:grayscale(1);opacity:.3}
.msg{background:#FFF7E0;border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:700}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 4px;font-weight:800;font-family:'Baloo 2'}
.fr span:first-child{border-bottom:3px solid currentColor;padding:0 5px}
.confetti{position:fixed;top:-40px;font-size:28px;animation:fall linear forwards;z-index:80;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stk div{background:#fff;border:2px solid var(--line);border-radius:18px;text-align:center;padding:10px 4px;font-size:12px;font-weight:700}
.stk div span{font-size:40px;display:block}
.stk div.no span{filter:grayscale(1);opacity:.25}
.stk div.no{color:#B8B2A0}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:13px}
input.txt{font:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);width:100%;outline:none}
input.txt:focus{border-color:var(--bl)}
.pets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 18px}
.petc{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 4px;font-weight:700;color:var(--ink)}
.petc span{font-size:44px;display:block}
.petc.sel{border-color:var(--or);background:#FFF3E6}
.hero{text-align:center;padding:26px 0 8px}
.hero h1{font-size:34px}
.wkbar{display:flex;gap:6px;margin-top:6px}
.wkbar i{flex:1;height:10px;border-radius:5px;background:#F1E8D4}
.wkbar i.r{background:var(--rd)}.wkbar i.y{background:var(--ye)}.wkbar i.g{background:var(--gr)}
@media (max-width:480px){.qcard{font-size:21px}.qcard .big{font-size:32px}.sent{font-size:23px}.opt{font-size:20px}}
.tools{grid-template-columns:repeat(3,1fr)!important}
.banner{display:block;width:100%;border:0;border-radius:18px;padding:12px 14px;margin-bottom:10px;font-size:17px;font-weight:700;text-align:left;color:#fff;background:linear-gradient(135deg,#8B5CF6,#EC4899);box-shadow:0 5px 0 #6D3FD6}
.banner.gold{background:linear-gradient(135deg,#FFC93C,#FF8A3D);box-shadow:0 5px 0 #D9661A}
.banner.green{background:linear-gradient(135deg,#34D399,#10B981);box-shadow:0 5px 0 #0E8A62}
.banner b{float:right}
.mode{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:3px 12px;background:#EAF7EF;color:#1F8A50;margin-top:6px}
.mode.local{background:#FFF0D9;color:#B45F06}
.note{background:#FDECEC;color:#B42318;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;margin:8px 0}
.pcard{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);padding:12px;margin-bottom:10px}
.pcard.me{border-color:#FFD98A;background:#FFFBF0}
.pet.sm{width:58px;height:58px;font-size:36px}
.chcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.chcard table{margin-top:6px}
.feed{padding:7px 2px;border-bottom:1px dashed var(--line);font-size:15px}
.feed:last-child{border:0}
.sec{margin:22px 4px 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#2B2A4C;color:#fff;padding:10px 18px;border-radius:14px;z-index:95;font-weight:700;animation:fade .2s;max-width:90vw;text-align:center}
.chip.act{background:#FFF3C9;border-color:#FFC93C}
.lbl{font-weight:800;margin:14px 0 6px}
.sel{font:inherit;font-size:17px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);width:100%;background:#fff}
label.chip{cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.hint{background:#FFF7E0;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:17px}
.stk .tre{background:#fff;border:3px solid var(--line);border-radius:18px;text-align:center;padding:10px 4px;font-size:13px;font-weight:700;color:var(--ink)}
.stk .tre span{font-size:40px;display:block}
.stk .tre small{display:block;font-size:12px}
.stk .tre.eq{background:#FFF3C9;box-shadow:0 0 0 3px #FFC93C}
.stk div small{display:block;font-size:12px}
.reveal{position:relative;text-align:center;min-height:300px}
.chest{position:absolute;left:0;right:0;top:50px;font-size:96px;animation:cshake .7s both;pointer-events:none}
@keyframes cshake{0%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(14deg)}45%{transform:rotate(-12deg)}60%{transform:rotate(12deg) scale(1.15)}85%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(1.8)}}
.prize{animation:pop2 .55s .65s both}
@keyframes pop2{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.big-ic{font-size:84px;line-height:1.2}
.r-SR .big-ic{filter:drop-shadow(0 0 10px #A78BFA)}
.r-SSR .big-ic{filter:drop-shadow(0 0 16px #FACC15)}
.rar{display:inline-block;color:#fff;border-radius:99px;padding:2px 14px;font-weight:800;margin:4px 0}
.crown{font-size:18px}
.face{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 2px #FFD98A;display:inline-grid;place-items:center;background:#FFF0D1;font-size:26px;vertical-align:middle;flex:none;line-height:1}
.face.sm{width:30px;height:30px;font-size:18px;border-width:2px}
.face.lg{width:62px;height:62px;font-size:36px}
.face.xl{width:92px;height:92px;font-size:54px}
.node .ic .face{margin:0 auto}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:6px 0 12px;border-bottom:1px dashed var(--line);margin-bottom:4px}
.pod{flex:1;max-width:150px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.pod .md{font-size:28px;line-height:1}
.pod b{font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{font-weight:800;color:var(--ord)}
.pod .step{width:100%;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#FFE9B0,#FFD47A)}
.pod.r1 .step{height:54px;background:linear-gradient(180deg,#FFE27A,#FFC23C)}.pod.r2 .step{height:36px;background:linear-gradient(180deg,#EEF1F6,#CBD3E0)}.pod.r3 .step{height:24px;background:linear-gradient(180deg,#F9DCC4,#E9B48A)}
.pod.r1 .face{box-shadow:0 0 0 3px #FFC23C,0 0 18px rgba(255,194,60,.7)}
.pod.me b{color:var(--ord)}
.qcard .long{text-align:left;font-size:19px;line-height:1.75;font-weight:600}
.opts.one{grid-template-columns:1fr}.opts.one .opt{font-size:18px;text-align:left;min-height:52px;padding:10px 14px}
@media (max-width:480px){.qcard .long{font-size:17px}}
</style>

<body>
<div id="app"></div>
<script>
//#GEN-START
let RND=Math.random;
function mulberry(a){a=a>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function withSeed(seed,fn){const old=RND;RND=mulberry(seed);try{return fn();}finally{RND=old;}}

const R=(a,b)=>Math.floor(RND()*(b-a+1))+a;
const P=a=>a[Math.floor(RND()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RND()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const CMP=['＞','＜','＝'];
function mc(prompt,correct,wrongs,tip,extra){correct=String(correct);const w=[...new Set(wrongs.map(String))].filter(x=>x!==correct).slice(0,3);const opts=shuf([correct,...w]);return Object.assign({type:'mc',prompt,opts,ans:opts.indexOf(correct),tip:tip||''},extra||{});}
function nq(prompt,ans,tip,extra){return Object.assign({type:'num',prompt,ans,tip:tip||''},extra||{});}
function cmpq(prompt,a,b,tip,extra){const c=a>b?'＞':a<b?'＜':'＝';return Object.assign({type:'mc',prompt,opts:CMP.slice(),ans:CMP.indexOf(c),tip:tip||'',cmp:1},extra||{});}
const big=s=>`<span class="big">${s}</span>`;

// ---------- SVG helpers ----------
function angSVG(deg,len){len=len||55;const vx=deg>95?78:28,vy=82,r=Math.PI/180*deg;const x2=vx+len*Math.cos(r),y2=vy-len*Math.sin(r);let mark;
 if(deg===90)mark=`<path d="M${vx+12} ${vy} L${vx+12} ${vy-12} L${vx} ${vy-12}" fill="none" stroke="#FF8A3D" stroke-width="3"/>`;
 else{const ar=15,ax=vx+ar*Math.cos(r),ay=vy-ar*Math.sin(r);mark=`<path d="M${vx+ar} ${vy} A${ar} ${ar} 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" stroke="#FF8A3D" stroke-width="3"/>`;}
 return `<svg viewBox="0 0 150 95" width="130" height="82"><line x1="${vx}" y1="${vy}" x2="${vx+len}" y2="${vy}" stroke="#2B2A4C" stroke-width="4" stroke-linecap="round"/><line x1="${vx}" y1="${vy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#2B2A4C" stroke-width="4" stroke-linecap="round"/>${mark}<circle cx="${vx}" cy="${vy}" r="4" fill="#2B2A4C"/></svg>`;}
function clockSVG(h){let t='';for(let i=0;i<12;i++){const a=i*Math.PI/6;t+=`<line x1="${(60+43*Math.sin(a)).toFixed(1)}" y1="${(60-43*Math.cos(a)).toFixed(1)}" x2="${(60+50*Math.sin(a)).toFixed(1)}" y2="${(60-50*Math.cos(a)).toFixed(1)}" stroke="#2B2A4C" stroke-width="${i%3?2:4}"/>`;}const ha=h*Math.PI/6;
 return `<svg viewBox="0 0 120 120" width="130" height="130"><circle cx="60" cy="60" r="54" fill="#fff" stroke="#2B2A4C" stroke-width="4"/>${t}<line x1="60" y1="60" x2="60" y2="17" stroke="#4C8DFF" stroke-width="4" stroke-linecap="round"/><line x1="60" y1="60" x2="${(60+30*Math.sin(ha)).toFixed(1)}" y2="${(60-30*Math.cos(ha)).toFixed(1)}" stroke="#FF8A3D" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="60" r="4" fill="#2B2A4C"/></svg>`;}
function pieSVG(d,s){const c=60,r=52;let o='';for(let i=0;i<d;i++){const a0=-Math.PI/2+i*2*Math.PI/d,a1=a0+2*Math.PI/d;o+=`<path d="M${c} ${c} L${(c+r*Math.cos(a0)).toFixed(1)} ${(c+r*Math.sin(a0)).toFixed(1)} A${r} ${r} 0 0 1 ${(c+r*Math.cos(a1)).toFixed(1)} ${(c+r*Math.sin(a1)).toFixed(1)} Z" fill="${i<s?'#FFC93C':'#fff'}" stroke="#2B2A4C" stroke-width="2.5"/>`;}return `<svg viewBox="0 0 120 120" width="130" height="130">${o}</svg>`;}
function barSVG(d,s){const w=200/d;let o='';for(let i=0;i<d;i++)o+=`<rect x="${(4+i*w).toFixed(1)}" y="4" width="${w.toFixed(1)}" height="44" fill="${i<s?'#7CC8FF':'#fff'}" stroke="#2B2A4C" stroke-width="2.5"/>`;return `<svg viewBox="0 0 208 52" width="240" height="60">${o}</svg>`;}

function gramGen(bank,lv){
 let pool=bank.filter(i=>i.d<=lv);if(pool.length<6)pool=bank;const it=P(pool);
 const sent=it.s.replace('___',it.a).replace(/\s*👉.*$/,'').trim();
 if(lv===3&&RND()<.5){const words=sent.split(/\s+/);if(words.length>=3&&words.length<=7&&!/[.?!]\s/.test(sent)){let sc,guard=0;do{sc=shuf(words);guard++;}while(sc.join(' ')===sent&&guard<20);return {type:'order',prompt:'把單字排成正確的句子',zh:it.z,words:sc,ans:sent,tip:it.t,say:sent,en:1};}}
 const opts=shuf(it.o);return {type:'mc',prompt:`<div class="sent">${it.s.replace('___','<span class="blank">___</span>')}</div>`,opts,ans:opts.indexOf(it.a),tip:it.t,zh:it.z,say:sent,en:1,engOpts:1,showZh:lv===1};}

let JN=0;
function jsonp(url){return new Promise((res,rej)=>{const cb='__kq'+(++JN)+'_'+Math.floor(Math.random()*1e6),s=document.createElement('script');let done=false;
 const end=()=>{done=true;try{delete window[cb];}catch(e){window[cb]=undefined;}s.remove();};
 window[cb]=d=>{if(done)return;end();res(d);};s.onerror=()=>{if(done)return;end();rej(new Error('net'));};
 setTimeout(()=>{if(done)return;end();rej(new Error('timeout'));},15000);s.src=url+(url.includes('?')?'&':'?')+'cb='+cb;document.head.appendChild(s);});}
let PULLING=false,LASTPULL=0;
async function pull(){if(Store.mode!=='cloud'||PULLING)return false;PULLING=true;
 try{flushOutbox();const d=await jsonp(API_URL+'?action=all&code='+encodeURIComponent(getCode()));
  if(!d||d.error){Store.note=d&&d.error==='code'?'家庭通關密語不正確，請家長到家長區重新輸入':'讀取雲端資料失敗';return false;}
  merge(d);Store.note='';LASTPULL=now();persistLocal();return true;}
 catch(e){Store.note='暫時連不上雲端，進度會先存在這台裝置，連上後再同步';return false;}
 finally{PULLING=false;}}
function merge(d){const sp={};(d.players||[]).forEach(p=>{if(p&&p.id)sp[sid(p.id)]=p;});
 const m={};for(const id in sp){const l=Store.players[id];m[id]=(l&&(+l.rev||0)>(+sp[id].rev||0))?l:sp[id];}
 for(const id in Store.players)if(!sp[id]&&(now()-(+Store.players[id].at||0))<10*60000&&!DELETED[id])m[id]=Store.players[id];   // 剛建立、還沒上傳完的角色先留著
 Store.players=m;
 (d.challenges||[]).forEach(c=>{if(c&&c.id)Store.challenges[sid(c.id)]=c;});
 (d.results||[]).forEach(r=>{if(r&&r.id)Store.results[sid(r.id)]=r;});
 const fm={};[...(d.feed||[]),...Store.feed].forEach(f=>{if(f&&f.id)fm[f.id]=f;});Store.feed=Object.values(fm).sort((a,b)=>(+b.at||0)-(+a.at||0)).slice(0,40);
 const cut=now()-10*DAY;for(const id in Store.challenges)if(!(Store.challenges[id].at>cut))delete Store.challenges[id];
 if(S&&sp[S.id]&&(+sp[S.id].rev||0)>(+S.rev||0))S=fixPlayer(sp[S.id]);setTimeout(syncAvatars,0);}

function outbox(){try{return JSON.parse(lsGet(OUTKEY))||[];}catch(e){return [];}}

function flushOutbox(){const o=outbox();if(!o.length)return;setOutbox([]);o.forEach(m=>{m.code=getCode();post(m).catch(()=>{const a=outbox();a.push(m);setOutbox(a);});});}

const MISSIONS=[{id:'a',t:'完成 3 個關卡',need:3,get:d=>d.done},{id:'b',t:'答對 30 題',need:30,get:d=>d.correct},{id:'c',t:'數學和英文各玩 1 關',need:2,get:d=>(d.math>0?1:0)+(d.eng>0?1:0)},{id:'d',t:'完成上面三個任務',need:3,get:d=>['a','b','c'].filter(x=>d.claimed.includes(x)).length,chest:1}];
function home(){if(!S)return picker();VIEW='home';if(ensureDaily())save();clearArc();
 const ms=worldStars('math'),es=worldStars('eng'),emax=WORLD.eng.zones.reduce((a,z)=>a+z.nodes.length,0)*9;
 const pend=pendingForMe(),clm=claimableForMe();let ban='';
 if(pend.length)ban+=`<button class="banner" onclick="plaza()">⚔️ ${esc(pname(pend[0].from))} 向你發起挑戰！${pend.length>1?`（共 ${pend.length} 個）`:''}<b>去應戰 ➜</b></button>`;
 if(clm.length)ban+=`<button class="banner green" onclick="plaza()">🏆 有 ${clm.length} 場對決結果出爐了<b>去看看 ➜</b></button>`;
 if(S.chests.length)ban+=`<button class="banner gold" onclick="bag()">🎁 你有 ${S.chests.length} 個寶箱還沒打開！<b>開寶箱 ➜</b></button>`;
 const mis=MISSIONS.map(m=>{const v=Math.min(m.get(S.daily),m.need),done=v>=m.need,cl=S.daily.claimed.includes(m.id);return `<div class="mis"><div style="font-size:24px">${cl?'✅':done?'🎁':'📌'}</div><div class="t">${m.t}<div class="mbar"><i style="width:${v/m.need*100}%"></i></div></div><div>${cl?'<span class="muted">已領取</span>':done?`<button class="btn gr sm" onclick="claim('${m.id}')">${m.chest?'領寶箱':'領 30 XP'}</button>`:`<span class="muted">${v}/${m.need}</span>`}</div></div>`;}).join('');
 h(`<div class="wrap">${topBar()}
<div class="chips"><span class="chip">🔥 連續 ${streakOf(S)} 天</span><span class="chip">⭐ ${ms+es}</span><span class="chip">🏅 ${S.stickers.length}</span>${S.buff.double?'<span class="chip act">📜 雙倍經驗準備中</span>':''}<button class="chip" onclick="S.mute=!S.mute;save();home()">${S.mute?'🔇':'🔊'}</button><button class="chip" onclick="picker()">👥 換人</button></div>
${ban}
<div class="worlds"><button class="world m" onclick="world('math')"><div class="ic">🏰</div><b>數字王國</b><small>翰林三上・卓越盃題型<br>⭐ ${ms} / ${WORLD.math.zones.reduce((a,z)=>a+z.nodes.length,0)*9}</small></button><button class="world e" onclick="world('eng')"><div class="ic">🌳</div><b>英語森林</b><small>單字・文法・時態<br>⭐ ${es} / ${emax}</small></button></div>
<div class="card"><h3>📅 今日任務</h3>${mis}</div>
<div class="tools"><button class="tool" onclick="plaza()"><span>🏆</span>排行榜・廣場${pend.length+clm.length?`<i class="badge">${pend.length+clm.length}</i>`:''}</button><button class="tool" onclick="bag()"><span>🎒</span>法寶袋${S.chests.length?`<i class="badge">${S.chests.length}</i>`:''}</button><button class="tool" onclick="arcade()"><span>⚡</span>九九快打</button><button class="tool" onclick="review()"><span>📦</span>錯題寶箱${S.wrong.length?`<i class="badge">${S.wrong.length}</i>`:''}</button><button class="tool" onclick="stickers()"><span>🏅</span>貼紙簿</button><button class="tool" onclick="parentGate()"><span>👨‍👩‍👧</span>家長區</button></div>
<div style="text-align:center;margin-top:14px">${modeBadge()}</div></div>`);}
function claim(id){ensureDaily();const m=MISSIONS.find(x=>x.id===id);if(!m||S.daily.claimed.includes(id)||m.get(S.daily)<m.need)return;S.daily.claimed.push(id);
 if(m.chest){giveChest('n');toast('🎁 得到一個寶箱！');}else{const msgs=[];gainXP(30,msgs);if(msgs.length)toast(msgs[0]);}save();sfx('win');home();}

function world(w){VIEW='world';const W=WORLD[w],ws=worldStars(w),bossOpen=ws>=W.boss.need,bst=(S.stars['boss-'+w]||[0])[0];
 const zones=W.zones.map(z=>`<div class="zone"><h3>${z.name}</h3><p class="muted">${z.desc}</p><div class="nodes">${z.nodes.map(n=>{const st=nst(n.id),tot=st[0]+st[1]+st[2];return `<button class="node" onclick="pickLv('${n.id}')"><div class="ic">${n.icon}</div>${n.unit?`<small>${n.unit}</small>`:''}<b>${n.name}</b><div class="lvrow">${st.map((s,i)=>`<span class="lvp ${s?'on':''}">L${i+1} ${s?'★'.repeat(s):(i===0||st[i-1]>=2?'○':'🔒')}</span>`).join('')}</div>${tot===9?'<small>🏅 全部完成</small>':''}</button>`;}).join('')}</div></div>`).join('');
 h(`<div class="wrap"><div class="row" style="justify-content:space-between"><button class="btn gh sm" onclick="home()">← 回家</button><h2>${W.icon} ${W.name}</h2><span class="chip">⭐ ${ws}</span></div>${zones}
<div class="zone"><h3>⚔️ 魔王關</h3><div class="nodes"><button class="node boss ${bossOpen?'':'lock'}" onclick="${bossOpen?`startBoss('${w}')`:`okModal('還沒解鎖喔！','在${W.name}收集 ${W.boss.need} 顆星就能挑戰魔王（目前 ${ws} 顆）。')`}"><div class="ic">${W.boss.icon}</div><b>${W.boss.name}</b><small>${bossOpen?`混合複習 12 題・打倒可得 2 個魔王寶箱・最佳 ${'★'.repeat(bst)||'尚未挑戰'}`:`🔒 收集 ${W.boss.need} 顆星解鎖（${ws}/${W.boss.need}）`}</small></button></div></div></div>`);}
function pickLv(id){const n=NODE[id],st=nst(id),d=LVDESC[n.kind||'math'];
 modal(`<div class="row"><div style="font-size:44px">${n.icon}</div><div><small class="muted">${n.unit||''}</small><h2>${n.name}</h2></div></div>
 ${[1,2,3].map(lv=>{const open=lv===1||st[lv-2]>=2;return `<button class="lvl" ${open?'':'disabled'} onclick="closeModal();startStage('${id}',${lv})"><span class="n">Lv${lv}</span><span class="d"><b>${d[lv-1]}</b><br><span class="muted">${open?'8 題・3 顆星必得寶箱':`Lv${lv-1} 拿到 2 顆星解鎖`}</span></span><span class="s">${open?starStr(st[lv-1]):'🔒'}</span></button>`;}).join('')}
 <div style="text-align:right;margin-top:14px"><button class="btn gh sm" onclick="closeModal()">關閉</button></div>`);}

// ================= 出題 =================
let PL=null;
const qKey=q=>[q.prompt,q.pic,q.listen,q.art,q.zh,q.ans,(q.opts||[]).length].join('|');
function genQ(node,lv,seed){const q=withSeed(seed,()=>NODE[node].gen(lv));q.node=node;q.lv=lv;q.seed=seed;q.k=node+'|'+lv+'|'+seed;return q;}
function makeQs(pickNode,lv,n,base){const out=[],seen=new Set();for(let g=0;g<300&&out.length<n;g++){const node=pickNode(g);const q=genQ(node,lv,(base+g*7919)%2147483647);const k=node+qKey(q);if(seen.has(k)&&g<250)continue;seen.add(k);out.push(q);}return out;}
const blank=()=>({i:0,tries:0,pts:0,firstOk:0,combo:0,maxCombo:0,xp:0,cleared:0,buf:'',built:[],locked:false,shield:false,lampUsed:false});
function startStage(id,lv){if(!NODE[id])return;const nd=NODE[id];PL=Object.assign(blank(),{mode:'stage',node:id,lv,world:nd.w,qs:makeQs(()=>id,lv,8,rseed())});renderQ();}
function startBoss(w){let pool=[];WORLD[w].zones.forEach(z=>z.nodes.forEach(n=>{if(nst(n.id)[0]>=1)pool.push(n);}));if(pool.length<2)pool=WORLD[w].zones.flatMap(z=>z.nodes);
 PL=Object.assign(blank(),{mode:'boss',world:w,qs:makeQs(()=>pool[Math.floor(Math.random()*pool.length)].id,2,12,rseed())});renderQ();}
function review(){if(!S.wrong.length)return okModal('📦 錯題寶箱是空的！','答錯的題目會自動收進來，之後在這裡複習。答對就會從寶箱移除。');
 PL=Object.assign(blank(),{mode:'review',qs:shuf(S.wrong).slice(0,8).map(w=>genQ(w.node,w.lv,w.seed))});renderQ();}
function padHTML(){return `<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="kp('${n}')">${n}</button>`).join('')}<button class="key" onclick="kp('del')">⌫</button><button class="key" onclick="kp('0')">0</button><button class="key ok" onclick="kp('ok')">✔</button></div>`;}
function itemsHTML(){const p=PL;if(!p||p.mode==='challenge')return '<span class="chip">⚔️ 對決中・不能用道具</span>';let s='';
 if(S.items.lamp>0&&!p.lampUsed)s+=`<button class="chip" onclick="useLamp()">💡 提示 ×${S.items.lamp}</button>`;
 if(p.shield)s+='<span class="chip act">🛡️ 守護盾啟動中</span>';else if(S.items.shield>0)s+=`<button class="chip" onclick="useShield()">🛡️ 守護盾 ×${S.items.shield}</button>`;return s;}
function refreshItems(){const e=$('#items');if(e)e.innerHTML=itemsHTML();}
function renderQ(){const p=PL,q=p.qs[p.i];p.tries=0;p.buf='';p.built=[];p.locked=false;p.lampUsed=false;
 const label=p.mode==='boss'?`${WORLD[p.world].boss.icon} 魔王關`:p.mode==='review'?'📦 錯題複習':p.mode==='challenge'?'⚔️ 對決':`${NODE[p.node].icon} Lv${p.lv}`;
 let c=`<div class="card qcard" id="qc">`;
 if(q.art)c+=`<div>${q.art}</div>`;
 if(q.pic)c+=`<div>${picHTML(q.pic)}</div>`;
 if(q.listen)c+=`<div><button class="say big" onclick="say(PL.qs[PL.i].listen)">🔊 再聽一次</button></div>`;
 c+=`<div class="${q.long?'long':''}">${q.prompt}</div>`;
 if(q.zh&&(q.type==='order'||q.type==='spell'||q.showZh))c+=`<div class="zh">${q.zh}</div>`;
 if(q.type==='spell')c+=`<button class="say" onclick="say(PL.qs[PL.i].say)">🔊 聽發音</button>`;
 c+='<div id="hint"></div></div>';
 let a='';
 if(q.type==='mc')a=`<div class="opts ${q.cmp?'cmp':''} ${q.lo?'one':''}">${q.opts.map((o,i)=>`<button class="opt ${q.optPic||q.bigOpts?'pico':''}" id="o${i}" onclick="pickOpt(${i})"${q.engOpts?' style="font-family:\'Baloo 2\'"':''}>${o}</button>`).join('')}</div>`;
 else if(q.type==='num')a=`<div class="disp" id="disp">&nbsp;</div>${padHTML()}`;
 else a=`<div class="disp" id="disp"></div><div class="tiles" id="tiles"></div><div class="row" style="justify-content:center;margin-top:16px"><button class="btn gh" onclick="tileClear()">↺ 重來</button><button class="btn gr" onclick="tileOk()">✔ 確定</button></div>`;
 h(`<div class="wrap"><div class="phead"><button class="btn gh sm" onclick="quit()">✕</button><div class="prog"><i style="width:${p.i/p.qs.length*100}%"></i></div><span class="combo">${p.combo>=2?'🔥x'+p.combo:''}</span></div><div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-top:6px"><span class="muted" style="font-weight:700">${label}・第 ${p.i+1} / ${p.qs.length} 題</span><span class="chips" id="items" style="margin:0">${itemsHTML()}</span></div>${c}${a}<div class="spacer"></div></div>`);
 if(q.type==='spell'||q.type==='order')drawTiles();
 if(q.listen)setTimeout(()=>say(q.listen),200);}
function useLamp(){const p=PL,q=p.qs[p.i];if(!p||p.locked||$('#fb')||p.lampUsed||S.items.lamp<1||p.mode==='challenge')return;p.lampUsed=true;S.items.lamp--;save();let removed=0;
 if(q.type==='mc'){const w=q.opts.map((o,i)=>i).filter(i=>i!==q.ans&&!$('#o'+i).classList.contains('no'));shuf(w).slice(0,Math.min(2,w.length-1)).forEach(i=>{$('#o'+i).classList.add('no');removed++;});}
 if(!removed){let t=q.tip;if(!t){if(q.type==='num')t=`答案是 ${String(q.ans).length} 位數`;else if(q.type==='spell')t=`第一個字母是 ${q.ans[0]}`;else if(q.type==='order')t=`第一個字是 ${q.ans.split(' ')[0]}`;else t='仔細再讀一次題目';}$('#hint').innerHTML=`<div class="hint">💡 ${t}</div>`;}
 sfx('tap');refreshItems();}
function useShield(){const p=PL;if(!p||p.locked||p.shield||S.items.shield<1||p.mode==='challenge')return;p.shield=true;S.items.shield--;save();refreshItems();toast('🛡️ 守護盾啟動！下次答錯不扣分');}
function pickOpt(i){const p=PL,q=p.qs[p.i];if(p.locked||$('#fb'))return;const ok=i===q.ans;$('#o'+i).classList.add(ok?'ok':'no');answer(ok);}
function updDisp(){const d=$('#disp');if(d){d.classList.remove('bad');d.innerHTML=esc(PL.buf)||'&nbsp;';}}
function kp(k){if(PL&&PL.mode==='arcade')return arcKey(k);const p=PL;if(!p||p.locked||$('#fb'))return;
 if(k==='del')p.buf=p.buf.slice(0,-1);else if(k==='ok'){if(p.buf==='')return;return answer(+p.buf===p.qs[p.i].ans);}else if(p.buf.length<7)p.buf=(p.buf==='0'?'':p.buf)+k;sfx('tap');updDisp();}
function drawTiles(){const q=PL.qs[PL.i],items=q.type==='spell'?q.letters:q.words;
 $('#disp').innerHTML=PL.built.length?PL.built.map((ix,k)=>`<button class="tile in" onclick="tileBack(${k})">${esc(items[ix])}</button>`).join(''):`<span class="muted" style="font-size:16px">點下面的${q.type==='spell'?'字母':'單字'}</span>`;
 $('#tiles').innerHTML=items.map((t,ix)=>`<button class="tile ${PL.built.includes(ix)?'used':''}" onclick="tileAdd(${ix})">${esc(t)}</button>`).join('');}
function tileAdd(ix){if(PL.locked||$('#fb')||PL.built.includes(ix))return;PL.built.push(ix);sfx('tap');drawTiles();}
function tileBack(k){if(PL.locked||$('#fb'))return;PL.built.splice(k,1);drawTiles();}
function tileClear(){if(PL.locked||$('#fb'))return;PL.built=[];drawTiles();}
function tileOk(){const q=PL.qs[PL.i];if(PL.locked||$('#fb')||!PL.built.length)return;const items=q.type==='spell'?q.letters:q.words;answer(PL.built.map(i=>items[i]).join(q.type==='spell'?'':' ')===q.ans);}
function stat(q,first){const s=S.stats[q.node]||(S.stats[q.node]={n:0,c:0});s.n++;if(first)s.c++;}
function addWrong(q){if(!S.wrong.some(w=>w.k===q.k)){S.wrong.unshift({k:q.k,node:q.node,lv:q.lv,seed:q.seed});S.wrong=S.wrong.slice(0,40);}}
function shakeQ(){const qc=$('#qc');if(qc){qc.classList.remove('shake');void qc.offsetWidth;qc.classList.add('shake');}}
function answer(ok){const p=PL,q=p.qs[p.i];if(p.locked)return;ensureDaily();
 if(ok){p.locked=true;const first=p.tries===0;p.pts+=first?1:.5;let xp=first?10:5;
  if(first){p.combo++;p.firstOk++;if(p.combo>=3)xp+=5;}else p.combo=0;p.maxCombo=Math.max(p.maxCombo,p.combo);p.xp+=xp;S.daily.correct++;stat(q,first);
  if(p.mode==='review'&&first){S.wrong=S.wrong.filter(w=>w.k!==q.k);p.cleared++;}else if(!first)addWrong(q);
  sfx('ok');if(q.en)say(q.say);fb('ok',first?(p.combo>=3?`連續答對 ${p.combo} 題！🔥`:P(PRAISE)):'第二次就答對，很棒！',`+${xp} XP`);}

function plaza(){if(!S)return picker();if(VIEW!=='plaza'&&Store.mode==='cloud'&&now()-LASTPULL>5000)pull().then(rerender);VIEW='plaza';clearArc();const ps=Object.values(allPlayers()).filter(p=>p&&p.id&&p.name).sort((a,b)=>(b.at||0)-(a.at||0));
 const cards=ps.map(p=>{const L=lvInfo(p.xp),me=p.id===S.id,eq=TRE[p.equip],tre=Object.keys(p.treasures||{}).filter(k=>TRE[k]).length;
  return `<div class="pcard ${me?'me':''}">${face(p,'lg')}<div style="flex:1;min-width:0"><b style="font-size:18px">${esc(p.name)}</b> ${petIcon(p)}${me?' <span class="muted">（我）</span>':''} ${eq?`<span title="${eq.name}">${eq.icon}</span>`:''}<div class="muted" style="font-size:13px;font-weight:700">Lv.${L.l}・⭐ ${starsOf(p)}・🔥 ${streakOf(p)} 天・🎒 法寶 ${tre}・🏅 ${(p.stickers||[]).length}</div><div class="xpbar"><i style="width:${(L.cur/L.need*100).toFixed(1)}%"></i></div><div class="muted" style="font-size:12px">${p.lastDay===today()?'✅ 今天練習過了':'💤 今天還沒練習'}</div></div>${me?'':`<button class="btn or sm" onclick="newChallenge('${sid(p.id)}')">⚔️</button>`}</div>`;}).join('');
 const cs=myChs().sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,15);
 const chs=cs.length?cs.map(c=>{const st=chState(c),mine=chParts(c).includes(S.id);let act='';
  if(c.to.map(sid).includes(S.id)&&!chRes(c,S.id)&&!st.expired)act=`<button class="btn or sm" onclick="acceptCh('${sid(c.id)}')">⚔️ 應戰</button>`;
  else if(mine&&chRes(c,S.id)&&st.final&&!S.chDone[c.id])act=`<button class="btn gr sm" onclick="claimCh('${sid(c.id)}')">🏆 看結算</button>`;
  const status=st.final?(st.res.length<2?'⌛ 已過期':'✅ 已結束'):`⏳ 剩 ${Math.max(0,Math.ceil(((+c.exp||0)-now())/3600000))} 小時`;
  return `<div class="chcard"><div class="row" style="justify-content:space-between"><b>${chLabelText(c)}</b><span class="muted" style="font-size:13px">${status}</span></div><div class="muted" style="font-size:14px">${esc(pname(c.from))} 發起・${ago(+c.at||0)}</div>${chTable(c)}${act?`<div style="text-align:right;margin-top:8px">${act}</div>`:''}</div>`;}).join(''):'<p class="muted">還沒有對決。點小勇士旁邊的 ⚔️ 就能發起挑戰！</p>';
 const feed=Store.feed.length?Store.feed.slice(0,20).map(f=>`<div class="feed">${esc(f.icon)} <b>${esc(pname(f.pid))}</b> ${esc(f.msg)} <span class="muted" style="font-size:13px">・${ago(+f.at||0)}</span></div>`).join(''):'<p class="muted">還沒有動態。</p>';
 h(`<div class="wrap"><div class="row" style="justify-content:space-between"><button class="btn gh sm" onclick="home()">← 回家</button><h2>🏟️ 好友廣場</h2><button class="btn or sm" onclick="newChallenge()">⚔️ 挑戰</button></div><div style="text-align:center;margin-top:8px">${modeBadge()}</div>
<div class="sec">🏆 排行榜</div>${lbHTML(ps)}
<div class="sec">👥 小勇士們</div>${cards}
<div class="sec">⚔️ 對決</div>${chs}
<div class="sec">📰 最新動態</div><div class="card">${feed}</div></div>`);}

// ================= 法寶袋 =================
function bag(){if(!S)return picker();VIEW='bag';const owned=TREASURES.filter(t=>S.treasures[t.id]).length,boss=S.chests.filter(t=>t==='boss').length;
 h(`<div class="wrap"><div class="row" style="justify-content:space-between"><button class="btn gh sm" onclick="home()">← 回家</button><h2>🎒 法寶袋</h2><span class="chip">✨ ${owned}/${TREASURES.length}</span></div>
<div class="card" style="text-align:center;margin-top:14px">${S.chests.length?`<div style="font-size:72px" class="bob">🎁</div><h3>你有 ${S.chests.length} 個寶箱${boss?`（${boss} 個魔王寶箱）`:''}</h3><button class="btn or" style="margin-top:10px" onclick="openChest()">打開寶箱！</button>`:'<div style="font-size:52px">📦</div><p class="muted" style="font-weight:600">目前沒有寶箱。<br>3 顆星過關、升級、完成每日任務、打倒魔王、贏得對決都能拿到寶箱！</p>'}</div>
<div class="card" style="margin-top:14px"><h3>🧪 道具</h3>${Object.entries(ITEMS).map(([k,it])=>`<div class="mis"><div style="font-size:30px">${it.icon}</div><div class="t">${it.name} ×${S.items[k]||0}<div class="muted" style="font-size:13px">${it.d}</div></div>${k==='scroll'?(S.buff.double?'<span class="chip act">準備中</span>':(S.items.scroll>0?'<button class="btn pu sm" onclick="useScroll()">使用</button>':'')):''}</div>`).join('')}<p class="muted" style="font-size:13px;margin-bottom:0">💡 🛡️ 在答題畫面上方使用；⏳ 在九九快打使用；對決中不能用道具。</p></div>
<div class="card" style="margin-top:14px"><h3>✨ 法寶收藏</h3><p class="muted" style="font-size:14px">點一下已經有的法寶就能「裝備」，名字旁邊會出現它，好友廣場的大家都看得到。</p>
<div class="stk">${TREASURES.map(t=>{const n=S.treasures[t.id]||0;return n?`<button class="tre ${S.equip===t.id?'eq':''}" style="border-color:${RAR[t.r].c}" onclick="equip('${t.id}')"><span>${t.icon}</span>${t.name}<small style="color:${RAR[t.r].c}">${RAR[t.r].n}${n>1?' ×'+n:''}${S.equip===t.id?'・裝備中':''}</small></button>`:`<div class="no"><span>❔</span>？？？<small style="color:${RAR[t.r].c}">${RAR[t.r].n}</small></div>`;}).join('')}</div>
<p class="muted" style="font-size:13px">機率：普通 60%・稀有 28%・史詩 10%・傳說 2%（魔王寶箱更容易開出稀有以上）。抽到重複的法寶會變成經驗值。</p></div></div>`);}
function openChest(){if(!S.chests.length)return;const tier=S.chests.shift(),res=roll(tier);let extra='';const msgs=[];
 if(res.kind==='item')S.items[res.id]=(S.items[res.id]||0)+1;
 else{const had=S.treasures[res.id]||0;S.treasures[res.id]=had+1;if(had){gainXP(DUPXP[res.rar],msgs);extra=`已經有這個法寶了，轉換成 ${DUPXP[res.rar]} XP`;}if(!S.equip)S.equip=res.id;if(!had&&(res.rar==='SR'||res.rar==='SSR'))addFeed(res.rar==='SSR'?'🌟':'✨',`開出了${RAR[res.rar].n}法寶「${TRE[res.id].icon}${TRE[res.id].name}」！`);}
 save();const info=res.kind==='item'?ITEMS[res.id]:TRE[res.id],rc=RAR[res.rar];
 modal(`<div class="reveal"><div class="chest">🎁</div><div class="prize r-${res.rar}"><div class="big-ic">${info.icon}</div><div class="rar" style="background:${rc.c}">${rc.n}${res.kind==='item'?'道具':'法寶'}</div><h2>${info.name}</h2><p class="muted">${info.d}</p>${extra?`<div class="msg">${extra}</div>`:''}${msgs.map(m=>`<div class="msg">${m}</div>`).join('')}
 <div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:12px">${S.chests.length?`<button class="btn or" onclick="openChest()">再開一個（剩 ${S.chests.length}）</button>`:''}<button class="btn gh" onclick="closeModal();bag()">收下</button></div></div></div>`);
 sfx(res.rar==='SSR'||res.rar==='SR'?'up':'win');if(res.rar==='SSR'||res.rar==='SR')setTimeout(confetti,600);}
function equip(id){if(!S.treasures[id])return;S.equip=id;save();sfx('tap');bag();}
function useScroll(){if(S.items.scroll<1||S.buff.double)return;S.items.scroll--;S.buff.double=true;save();toast('📜 下一關的經驗值會變兩倍！');bag();}

// ================= 貼紙簿 =================
function stickers(){VIEW='stickers';const all=[...WORLD.math.zones.flatMap(z=>z.nodes.map(n=>[n.id,n.icon,n.name])),...WORLD.eng.zones.flatMap(z=>z.nodes.map(n=>[n.id,n.icon,n.name])),['boss-math','🏆','數學大魔王'],['boss-eng','🏆','英文大魔王']];
 h(`<div class="wrap"><div class="row" style="justify-content:space-between"><button class="btn gh sm" onclick="home()">← 回家</button><h2>🏅 貼紙簿</h2><span class="chip">${S.stickers.length} / ${all.length}</span></div>
<p class="muted" style="font-weight:600">每個關卡的 Lv3 拿到 3 顆星，就能得到那一關的貼紙；打倒魔王（2 顆星以上）得到獎盃。</p>
<div class="stk">${all.map(([id,ic,nm])=>{const has=S.stickers.includes(id);return `<div class="${has?'':'no'}"><span>${ic}</span>${has?nm:'？？？'}</div>`;}).join('')}</div></div>`);}

// ================= 家長區 =================
let GATE=0;
function parentGate(){const a=R(12,19),b=R(12,19);GATE=a*b;modal(`<h3>👨‍👩‍👧 家長區</h3><p>請家長算一下：<b>${a} × ${b} = ?</b></p><input class="txt" id="gate" inputmode="numeric" style="margin-bottom:12px"><div class="row" style="justify-content:flex-end"><button class="btn gh" onclick="closeModal()">取消</button><button class="btn" onclick="if(+$('#gate').value===GATE){closeModal();parent();}else{$('#gate').value='';$('#gate').classList.add('shake');}">進入</button></div>`);setTimeout(()=>{const e=$('#gate');if(e)e.focus();},50);}
function parent(pid){VIEW='parent';const ps=allPlayers();pid=sid(pid);if(!pid||!ps[pid])pid=S.id;const K=fixPlayer(ps[pid]);const rows=[];
 for(const w of ['math','eng'])WORLD[w].zones.forEach(z=>z.nodes.forEach(n=>{const s=K.stats[n.id]||{n:0,c:0},st=Array.isArray(K.stars[n.id])?K.stars[n.id]:[0,0,0];rows.push({w,n,s,acc:s.n?s.c/s.n:null,stars:st.reduce((a,b)=>a+(+b||0),0)});}));
 const weak=rows.filter(r=>r.s.n>=6).sort((a,b)=>a.acc-b.acc).slice(0,3).filter(r=>r.acc<.8);
 const bar=a=>a===null?'<span class="muted">尚未練習</span>':`<b style="color:${a>=.8?'var(--grd)':a>=.6?'#C98A00':'var(--rd)'}">${Math.round(a*100)}%</b>`;
 const table=w=>`<table><tr><th>單元</th><th>答題</th><th>一次答對率</th><th>星星</th></tr>${rows.filter(r=>r.w===w).map(r=>`<tr><td>${r.n.icon} ${r.n.name}</td><td>${r.s.n}</td><td>${bar(r.acc)}</td><td>${r.stars}/9</td></tr>`).join('')}</table>`;
 const L=lvInfo(K.xp);
 h(`<div class="wrap"><div class="row" style="justify-content:space-between"><button class="btn gh sm" onclick="home()">← 回家</button><h2>👨‍👩‍👧 家長區</h2><span></span></div>
<div class="chips">${Object.values(ps).filter(p=>p&&p.id&&p.name).map(p=>`<button class="chip ${p.id===pid?'act':''}" onclick="parent('${sid(p.id)}')">${petIcon(p)} ${esc(p.name)}</button>`).join('')}</div>
<div class="card"><h3>📊 ${esc(K.name)} 的學習概況</h3><div class="chips"><span class="chip">Lv.${L.l}</span><span class="chip">練習 ${K.days} 天</span><span class="chip">最長連續 ${K.best} 天</span><span class="chip">共答 ${K.total} 題</span><span class="chip">錯題 ${K.wrong.length} 題</span><span class="chip">九九快打最佳 ${K.arcadeBest}</span><span class="chip">法寶 ${Object.keys(K.treasures).filter(k=>TRE[k]).length}/${TREASURES.length}</span></div>
${weak.length?`<div class="msg">需要多練習：${weak.map(r=>`${r.n.icon} ${r.n.name}（${Math.round(r.acc*100)}%）`).join('、')}</div>`:'<p class="muted">每個單元至少答 6 題後，這裡會列出最需要加強的單元。</p>'}</div>
<div class="card" style="margin-top:14px"><h3>🏰 數學（翰林三上＋卓越盃題型）</h3>${table('math')}</div>
<div class="card" style="margin-top:14px"><h3>🌳 英文</h3>${table('eng')}</div>
<div class="card" style="margin-top:14px;font-size:15px"><h3>⚙️ 管理 ${esc(K.name)}</h3>
<div class="row" style="flex-wrap:wrap">${pid===S.id?'<button class="btn gh sm" onclick="onboard(true)">改名字／夥伴／密碼</button>':''}${K.pin&&pid!==S.id?`<button class="btn gh sm" onclick="clearPin('${pid}')">清除密碼</button>`:''}${K.av?`<button class="btn gh sm" onclick="removeAv('${pid}')">移除頭貼</button>`:''}${pid!==S.id?`<button class="btn rd sm" onclick="askDel('${pid}')">刪除這個角色</button>`:'<span class="muted" style="font-size:14px">要刪除目前的角色，請先「換人」再到家長區刪除。</span>'}</div>
<p class="muted" style="margin-bottom:0">密碼只是防止孩子誤用別人的角色，不是安全保護。</p></div>
<div class="card" style="margin-top:14px;font-size:15px"><h3>🔗 ${Store.mode==='cloud'?'給孩子的專屬連結':'雲端同步'}</h3>${Store.mode==='cloud'?`<p class="muted">用這個連結或 QR code 打開，就不用再輸入家庭通關密語。請只給自己的孩子。</p><div id="qr" style="display:flex;justify-content:center;margin:10px 0"></div><input class="txt" id="kidlink" readonly value="${esc(kidLink())}" style="font-size:14px"><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm" onclick="copyLink()">複製連結</button><button class="btn gh sm" onclick="lsSet(CODEKEY,'');boot()">更換通關密語</button><button class="btn gh sm" onclick="useLocal()">改成單機模式</button></div>`:`<p class="muted">目前是單機模式。${API_URL.startsWith('__')?'這個網站還沒設定雲端。':'要和其他孩子同步，請改回雲端模式。'}</p>${API_URL.startsWith('__')?'':'<button class="btn sm" onclick="lsSet(\'kq_localonly\',\'\');boot()">改回雲端模式</button>'}`}</p></div></div>`);if(Store.mode==='cloud')drawQR();}

function askDel(pid){confirmBox(`確定要刪除 ${esc(pname(pid))} 的角色和全部紀錄嗎？<br><small class="muted">這個動作無法復原</small>`,()=>{delPlayer(pid).then(()=>parent());},'刪除');}
function kidLink(){return location.origin+location.pathname+'?k='+encodeURIComponent(getCode());}
function copyLink(){const v=kidLink();if(navigator.clipboard)navigator.clipboard.writeText(v).then(()=>toast('已複製連結'),()=>{$('#kidlink').select();});else $('#kidlink').select();}
function drawQR(){const el=$('#qr');if(!el)return;const go=()=>{try{el.innerHTML='';new QRCode(el,{text:kidLink(),width:180,height:180});}catch(e){}};if(window.QRCode)return go();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';sc.onload=go;document.head.appendChild(sc);}
function removeAv(pid){const p=allPlayers()[pid];if(!p)return;setAvatarFor(pid,'');if(pid===S.id){S.av=0;save();}else{const q=fixPlayer(p);q.av=0;q.rev=(+q.rev||0)+1;putPlayer(q);}toast('已移除頭貼');parent(pid);}
function clearPin(pid){const p=allPlayers()[pid];if(!p)return;const q=fixPlayer(p);q.pin='';q.rev=(+q.rev||0)+1;putPlayer(q);toast('已清除密碼');parent(pid);}

// ================= 鍵盤 =================
document.addEventListener('keydown',e=>{if($('#ov'))return;const f=$('#fb');if(e.key==='Enter'&&f){f.querySelector('button').click();e.preventDefault();return;}
 if(!PL)return;const q=PL.mode==='arcade'?{type:'num'}:PL.qs[PL.i];if(f&&PL.mode!=='arcade')return;
 if(q.type==='num'){if(/^[0-9]$/.test(e.key))kp(e.key);else if(e.key==='Backspace')kp('del');else if(e.key==='Enter')kp('ok');}
 else if(q.type==='mc'){const n=parseInt(e.key,10);if(n>=1&&n<=q.opts.length&&!$('#o'+(n-1)).classList.contains('no'))pickOpt(n-1);}
 else if(q.type==='spell'){if(/^[a-z]$/i.test(e.key)){const ix=q.letters.findIndex((c,i)=>c===e.key.toLowerCase()&&!PL.built.includes(i));if(ix>=0)tileAdd(ix);}else if(e.key==='Backspace'&&PL.built.length)tileBack(PL.built.length-1);else if(e.key==='Enter')tileOk();}});

boot();
</script>
</body>
</html>
